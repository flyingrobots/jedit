<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Editor chrome width profiles</title>
  <desc id="desc">Diagram showing receipt-backed applied markers, local pending and obstructed posture, source viewport, and footer across wide, narrow, and xs profiles.</desc>
  <style>
    :root{--bg:#080d13;--surface:#101820;--panel:#17212b;--line:#7d8da1;--text:#d5dde8;--muted:#8d98a8;--accent:#dc8cff;--cyan:#56d6d6;--green:#68e09b;--yellow:#f2c96b;--red:#ee7f7a}
    .canvas{fill:#080d13;fill:var(--bg,#080d13)}.term{fill:#101820;fill:var(--surface,#101820);stroke:#7d8da1;stroke:var(--line,#7d8da1);stroke-width:2;rx:10}.footer{fill:#141c25}.gutter{fill:#0b1118}.panel{fill:#17212b;fill:var(--panel,#17212b);stroke:#344253;stroke-width:1.5;rx:6}.label{fill:#dc8cff;fill:var(--accent,#dc8cff);font:700 21px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.small{fill:#8d98a8;fill:var(--muted,#8d98a8);font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.tiny{fill:#8d98a8;fill:var(--muted,#8d98a8);font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.micro{fill:#8d98a8;fill:var(--muted,#8d98a8);font:9px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.code{fill:#d5dde8;fill:var(--text,#d5dde8);font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ln{fill:#697586;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.accent{fill:#dc8cff;fill:var(--accent,#dc8cff)}.green{fill:#68e09b;fill:var(--green,#68e09b)}.yellow{fill:#f2c96b;fill:var(--yellow,#f2c96b)}.cyan{fill:#56d6d6;fill:var(--cyan,#56d6d6)}.red{fill:#ee7f7a;fill:var(--red,#ee7f7a)}
  </style>
  <rect class="canvas" width="1200" height="760"/>
  <text class="label" x="40" y="44">Editor chrome</text>
  <text class="small" x="40" y="70">The source viewport is framed by gutter, title, mode hints, cursor position, and posture.</text>

  <text class="label" x="70" y="122">wide</text>
  <rect class="term" x="70" y="140" width="1060" height="270"/>
  <rect class="footer" x="72" y="367" width="1056" height="40"/>
  <text class="accent" x="548" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700">settings.local.json *</text>
  <rect class="gutter" x="96" y="188" width="42" height="146"/>
  <line x1="138" y1="188" x2="138" y2="334" stroke="#673e87" stroke-width="2"/>
  <text class="ln" x="112" y="208">1</text><text class="ln" x="112" y="230">2</text><text class="ln" x="112" y="252">3</text><text class="ln" x="112" y="274">4</text><text class="ln accent" x="112" y="296">5</text>
  <text class="code green" x="128" y="230">+</text><text class="code cyan" x="128" y="252">?</text><text class="code red" x="128" y="274">!</text><text class="code yellow" x="120" y="274">-</text><text class="code cyan" x="128" y="296">~</text>
  <text class="yellow" x="154" y="208" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">{</text>
  <text class="green" x="178" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">"permissions": {</text>
  <text class="green" x="202" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">"allow": ["Bash(git:*)"]</text>
  <text class="yellow" x="178" y="274" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">}</text>
  <text class="code" x="154" y="296">this is a change</text>
  <rect x="286" y="283" width="9" height="19" fill="#82aaff"/>
  <text class="small" x="94" y="382">INSERT 5:17 [text input - esc normal - ctrl+s save]</text>
  <text class="tiny" x="94" y="400">/repo/settings.local.json</text>
  <text class="micro" x="430" y="400">[intent:idle | causal:unsaved | file:saved | git:unknown | remote:unknown | main | fs:unmaterialized | target:main | +0/-0]</text>

  <text class="label" x="70" y="462">narrow</text>
  <rect class="term" x="70" y="480" width="520" height="215"/>
  <rect class="footer" x="72" y="655" width="516" height="38"/>
  <text class="accent" x="250" y="508" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700">file.ts</text>
  <rect class="gutter" x="92" y="526" width="36" height="106"/>
  <line x1="128" y1="526" x2="128" y2="632" stroke="#673e87" stroke-width="2"/>
  <text class="ln accent" x="106" y="548">0</text><text class="ln" x="106" y="570">1</text><text class="ln" x="106" y="592">2</text>
  <text class="code green" x="120" y="570">+</text><text class="code cyan" x="120" y="592">?</text>
  <text class="code" x="144" y="548">relative numbers</text>
  <text class="green" x="144" y="570" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">keep Vim motions usable</text>
  <text class="tiny" x="92" y="670">NORMAL 12:4 [: command - F2]</text>
  <text class="tiny" x="92" y="687">/repo/file.ts</text>

  <text class="label" x="670" y="462">xs</text>
  <rect class="term" x="670" y="480" width="260" height="215"/>
  <rect class="footer" x="672" y="655" width="256" height="38"/>
  <text class="accent" x="760" y="508" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700">file</text>
  <rect class="gutter" x="692" y="526" width="30" height="106"/>
  <line x1="722" y1="526" x2="722" y2="632" stroke="#673e87" stroke-width="2"/>
  <text class="ln" x="702" y="548">1</text><text class="ln accent" x="702" y="570">2</text><text class="ln" x="702" y="592">3</text>
  <text class="code yellow" x="707" y="570">-</text><text class="code red" x="715" y="570">!</text><text class="code cyan" x="715" y="592">~</text>
  <text class="code" x="736" y="548">source</text>
  <text class="code" x="736" y="570">stays</text>
  <text class="code" x="736" y="592">readable</text>
  <text class="tiny" x="692" y="670">INSERT 3:7</text>
  <text class="tiny" x="692" y="687">file</text>
  <rect class="panel" x="965" y="498" width="165" height="174"/>
  <text class="code" x="986" y="526">rules</text>
  <text class="tiny" x="986" y="554">+ ~ - receipts</text>
  <text class="tiny" x="986" y="576">? app proposal</text>
  <text class="tiny" x="986" y="598">! obstruction</text>
  <text class="tiny" x="986" y="620">line:col only</text>
  <text class="tiny" x="986" y="642">when source owns</text>
  <text class="tiny" x="986" y="660">focus</text>
</svg>
