<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Settings menu width profiles</title>
  <desc id="desc">Diagram showing settings drawer, compact language and causal marker controls, diagnostics, and toasts across width profiles.</desc>
  <style>
    :root{--bg:#080d13;--surface:#101820;--panel:#17212b;--line:#7d8da1;--text:#d5dde8;--muted:#8d98a8;--accent:#dc8cff;--cyan:#56d6d6;--green:#68e09b;--yellow:#f2c96b;--red:#ee7f7a}
    .canvas{fill:#080d13;fill:var(--bg,#080d13)}.term{fill:#101820;fill:var(--surface,#101820);stroke:#7d8da1;stroke:var(--line,#7d8da1);stroke-width:2;rx:10}.drawer{fill:#0a0e12;stroke:#9aa4b3;stroke-width:2;rx:4}.panel{fill:#17212b;fill:var(--panel,#17212b);stroke:#344253;stroke-width:1.5;rx:6}.select{fill:#d8dee9}.footer{fill:#141c25}.label{fill:#dc8cff;fill:var(--accent,#dc8cff);font:700 21px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.small{fill:#8d98a8;fill:var(--muted,#8d98a8);font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.tiny{fill:#8d98a8;fill:var(--muted,#8d98a8);font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.code{fill:#d5dde8;fill:var(--text,#d5dde8);font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.accent{fill:#dc8cff;fill:var(--accent,#dc8cff)}.green{fill:#68e09b;fill:var(--green,#68e09b)}.yellow{fill:#f2c96b;fill:var(--yellow,#f2c96b)}.dark{fill:#111820;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <rect class="canvas" width="1200" height="760"/>
  <text class="label" x="40" y="44">Settings menu</text>
  <text class="small" x="40" y="70">F2 opens one themed drawer; long choices stay compact and changes produce toasts.</text>

  <text class="label" x="70" y="122">wide</text>
  <rect class="term" x="70" y="140" width="1060" height="270"/>
  <rect class="footer" x="72" y="367" width="1056" height="40"/>
  <text class="accent" x="540" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700">settings.local.json</text>
  <rect class="drawer" x="96" y="178" width="318" height="174"/>
  <text class="code" x="220" y="198">Settings</text>
  <rect class="select" x="116" y="216" width="278" height="24"/>
  <text class="dark" x="130" y="233">Language   &lt; English &gt; 1/14</text>
  <text class="tiny" x="130" y="258">en LTR</text>
  <text class="code" x="130" y="278">Theme      terminal</text>
  <text class="code" x="130" y="300">Line nums  Relative</text>
  <text class="code" x="130" y="322">Causal     Last save</text>
  <text class="code" x="130" y="344">Diagnostics open</text>
  <rect class="panel" x="438" y="178" width="300" height="174"/>
  <text class="code" x="458" y="206">Graft diagnostics</text>
  <text class="tiny" x="458" y="232">parser ready, graft 0.10.1,</text>
  <text class="tiny" x="458" y="254">Colorful unavailable. This</text>
  <text class="tiny" x="458" y="276">wraps by word boundary.</text>
  <rect class="panel" x="812" y="286" width="250" height="52"/>
  <text class="yellow" x="830" y="309" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">Settings changed</text>
  <text class="code" x="830" y="330">Line numbers: Absolute -&gt; Relative</text>
  <text class="small" x="94" y="393">SETTINGS [j/k move - enter change - f2 close - esc close]</text>

  <text class="label" x="70" y="462">narrow</text>
  <rect class="term" x="70" y="480" width="520" height="215"/>
  <rect class="footer" x="72" y="655" width="516" height="38"/>
  <rect class="drawer" x="92" y="514" width="250" height="120"/>
  <text class="code" x="180" y="534">Settings</text>
  <rect class="select" x="108" y="548" width="218" height="23"/>
  <text class="dark" x="118" y="565">&lt; English &gt; 1/14</text>
  <text class="code" x="118" y="590">Line nums Relative</text>
  <text class="code" x="118" y="610">Causal Last save</text>
  <text class="code" x="118" y="630">Diagnostics open</text>
  <rect class="panel" x="358" y="514" width="204" height="120"/>
  <text class="tiny" x="372" y="540">diagnostics beside</text>
  <text class="tiny" x="372" y="562">when room exists</text>
  <text class="tiny" x="92" y="678">SETTINGS [j/k - enter - esc]</text>

  <text class="label" x="670" y="462">xs</text>
  <rect class="term" x="670" y="480" width="260" height="215"/>
  <rect class="footer" x="672" y="655" width="256" height="38"/>
  <rect class="drawer" x="692" y="512" width="216" height="124"/>
  <text class="code" x="760" y="532">Settings</text>
  <rect class="select" x="708" y="548" width="184" height="23"/>
  <text class="dark" x="718" y="565">&lt; English &gt;</text>
  <text class="tiny" x="718" y="586">1/14 en LTR</text>
  <text class="code" x="718" y="608">Line nums Rel</text>
  <text class="tiny" x="718" y="628">Causal Save</text>
  <text class="tiny" x="692" y="678">SETTINGS [enter]</text>
  <rect class="panel" x="965" y="498" width="165" height="174"/>
  <text class="code" x="986" y="526">rules</text>
  <text class="tiny" x="986" y="554">no alternating</text>
  <text class="tiny" x="986" y="576">backgrounds</text>
  <text class="tiny" x="986" y="598">wide text clipped</text>
  <text class="tiny" x="986" y="620">or wrapped</text>
</svg>
