[package]
name = "jedit-echo-host"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
blake3 = "1"
bytes = "1"
echo-registry-api = { git = "https://github.com/flyingrobots/echo", rev = "0faaf58a15a4b03036cf36b465d79af76c952193" }
echo-wasm-abi = { git = "https://github.com/flyingrobots/echo", rev = "0faaf58a15a4b03036cf36b465d79af76c952193" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
warp-core = { git = "https://github.com/flyingrobots/echo", rev = "0faaf58a15a4b03036cf36b465d79af76c952193", features = ["native_rule_bootstrap", "trusted_runtime"] }

[dev-dependencies]
sha2 = "0.10"
static_assertions = "1"
tempfile = "3"
