[package]
name = "jedit-echo-host"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
blake3 = "1"
bytes = "1"
echo-registry-api = { git = "https://github.com/flyingrobots/echo", rev = "9c32e0b5e633ca68383ef09b5da7a4bc2d6b8e9e" }
echo-wasm-abi = { git = "https://github.com/flyingrobots/echo", rev = "9c32e0b5e633ca68383ef09b5da7a4bc2d6b8e9e" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
warp-core = { git = "https://github.com/flyingrobots/echo", rev = "9c32e0b5e633ca68383ef09b5da7a4bc2d6b8e9e", features = ["native_rule_bootstrap", "trusted_runtime"] }

[dev-dependencies]
sha2 = "0.10"
static_assertions = "1"
tempfile = "3"
