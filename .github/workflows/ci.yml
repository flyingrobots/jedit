name: CI

on:
  push:
    branches: [ main, enhancements ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full shard set
        required: false
        default: true
        type: boolean

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      test_shards: ${{ steps.plan.outputs.test_shards }}
      release_gate: ${{ steps.plan.outputs.release_gate }}
      full: ${{ steps.plan.outputs.full }}

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: Plan shards
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_CI: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && inputs.full || github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          ENFORCE_FROZEN: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'title-unfreeze') }}
        run: |
          args=(--base "$BASE_SHA" --head "$HEAD_SHA" --json --summary --github-output)
          if [[ "$FULL_CI" == "true" ]]; then
            args+=(--full)
          fi
          if [[ "$ENFORCE_FROZEN" == "true" ]]; then
            args+=(--enforce-frozen)
          fi
          node scripts/ci/changed-shards.mjs "${args[@]}"

  build:
    name: static / build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jedit-dist
          path: |
            dist
          if-no-files-found: error

      - name: Upload native Echo host
        uses: actions/upload-artifact@v4
        with:
          name: jedit-echo-host
          path: native/jedit-echo-host/target/debug/jedit-echo-host
          if-no-files-found: error

  test-shards:
    name: test / ${{ matrix.shard }}
    needs: [ plan, build ]
    if: needs.plan.outputs.test_shards != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.test_shards) }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: jedit-dist
          path: dist

      - name: Download native Echo host
        if: matrix.shard == 'echo-authority'
        uses: actions/download-artifact@v4
        with:
          name: jedit-echo-host
          path: native/jedit-echo-host/target/debug

      - name: Restore native Echo host executable permission
        if: matrix.shard == 'echo-authority'
        run: chmod +x native/jedit-echo-host/target/debug/jedit-echo-host

      - name: Run shard
        env:
          JEDIT_DIST_PREBUILT: '1'
        run: npm run ci:shard -- ${{ matrix.shard }}

  quality:
    name: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run quality

  release-gate:
    name: release-gate / jedit-echo
    needs: [ plan ]
    if: needs.plan.outputs.release_gate == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Echo release gate
        run: npm run release-gate:jedit-echo

  edict-replace-range:
    name: edict / replace-range package chain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Jedit
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: jedit

      - name: Verify literal submitted head
        working-directory: jedit
        env:
          EXPECTED_JEDIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_JEDIT_HEAD"

      - name: Read pinned toolchain commits
        id: toolchain
        working-directory: jedit
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from "node:fs";
          const lock = JSON.parse(
            readFileSync("edict/replace-range/edict.toolchain-lock.json", "utf8"),
          );
          console.log(`edict_commit=${lock.edict.commit}`);
          console.log(`echo_commit=${lock.echo.commit}`);
          console.log(`rust_toolchain=${lock.rust.toolchain}`);
          console.log(`node_version=${lock.validation.nodeVersion}`);
          NODE

      - name: Checkout pinned Edict
        uses: actions/checkout@v6.0.2
        with:
          repository: flyingrobots/edict
          ref: ${{ steps.toolchain.outputs.edict_commit }}
          path: edict

      - name: Checkout pinned Echo
        uses: actions/checkout@v6.0.2
        with:
          repository: flyingrobots/echo
          ref: ${{ steps.toolchain.outputs.echo_commit }}
          path: echo

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ steps.toolchain.outputs.node_version }}
          cache: 'npm'
          cache-dependency-path: jedit/package-lock.json

      - name: Setup pinned Rust
        run: rustup toolchain install '${{ steps.toolchain.outputs.rust_toolchain }}' --profile minimal

      - name: Install Jedit dependencies
        working-directory: jedit
        run: npm ci

      - name: Verify exact package chain and adversarial regressions
        working-directory: jedit
        env:
          EDICT_REPO: ${{ github.workspace }}/edict
          ECHO_REPO: ${{ github.workspace }}/echo
        run: node --test edict/replace-range/tests/proof-harness.spec.mjs

      - name: Verify authoritative checkouts remain clean
        run: |
          for repository in jedit edict echo; do
            if [[ -n "$(git -C "$repository" status --porcelain=v1 --untracked-files=all)" ]]; then
              echo "$repository changed during the package-chain gate" >&2
              git -C "$repository" status --short >&2
              exit 1
            fi
          done

  check:
    name: check
    needs: [ plan, build, test-shards, quality, release-gate, edict-replace-range ]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_SHARDS_RESULT: ${{ needs.test-shards.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          RELEASE_GATE_RESULT: ${{ needs.release-gate.result }}
          EDICT_REPLACE_RANGE_RESULT: ${{ needs.edict-replace-range.result }}
        run: |
          failed=0
          for result in "$PLAN_RESULT" "$BUILD_RESULT" "$QUALITY_RESULT" "$EDICT_REPLACE_RANGE_RESULT"; do
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done
          if [[ "$TEST_SHARDS_RESULT" != "success" && "$TEST_SHARDS_RESULT" != "skipped" ]]; then
            failed=1
          fi
          if [[ "$RELEASE_GATE_RESULT" != "success" && "$RELEASE_GATE_RESULT" != "skipped" ]]; then
            failed=1
          fi
          {
            echo "### CI aggregate"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| plan | $PLAN_RESULT |"
            echo "| static / build | $BUILD_RESULT |"
            echo "| test shards | $TEST_SHARDS_RESULT |"
            echo "| quality | $QUALITY_RESULT |"
            echo "| release gate | $RELEASE_GATE_RESULT |"
            echo "| edict / replace-range package chain | $EDICT_REPLACE_RANGE_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
