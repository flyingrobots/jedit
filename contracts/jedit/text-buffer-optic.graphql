"""
App-facing text buffer optic contract.

This schema owns editor nouns and explicit Jim text bases. Echo runtime
coordinates and transport capabilities belong below this boundary.
"""
scalar DateTime

"""Product-facing text buffer identity and display metadata."""
type TextBuffer {
    """Stable product identifier for this text buffer."""
    bufferId: ID!

    """Human-readable buffer key, such as a path-like editor name."""
    bufferKey: String!

    """Optional projected filesystem path or external source path."""
    projectionPath: String

    """Creation timestamp for the product buffer record."""
    createdAt: DateTime!
}

"""App-facing per-buffer capability snapshot."""
type TextBufferOptic {
    """Product buffer exposed by this optic."""
    buffer: TextBuffer!

    """Immutable text basis returned when this optic was opened."""
    openedTextBasis: TextWindowBasis!

    """Session-local product version for this buffer optic."""
    bufferVersion: Int!
}

"""Opaque Jim head identity and authoritative UTF-8 materialization range."""
type TextWindowBasis {
    """Opaque Jim rope-head fact identity; clients must not construct it."""
    basisHeadId: ID!

    """Inclusive UTF-8 byte offset for this materialization basis."""
    startByte: Int!

    """Exclusive UTF-8 byte offset for this materialization basis."""
    endByte: Int!
}

"""One line returned by a bounded text-window read."""
type TextWindowLine {
    """Zero-based line number in the buffer."""
    lineNumber: Int!

    """Inclusive UTF-8 byte offset where this line starts."""
    startByte: Int!

    """Exclusive UTF-8 byte offset where this line ends."""
    endByte: Int!

    """Line text for this bounded window entry."""
    text: String!
}

"""Bounded product-facing reading for painting editor text."""
type TextWindowReading {
    """Stable reading identifier for this observed window."""
    readingId: ID!

    """Exact immutable head and byte-range basis for this reading."""
    textBasis: TextWindowBasis!

    """Lines included in this bounded window."""
    lines: [TextWindowLine!]!

    """Total UTF-8 byte length represented by the returned lines."""
    byteLength: Int!

    """Zero-based first line included in this bounded window."""
    startLine: Int!

    """Number of returned lines."""
    lineCount: Int!

    """Total line count in the observed text frontier."""
    totalLineCount: Int!

    """True when earlier lines exist before this bounded window."""
    hasMoreBefore: Boolean!

    """True when later lines exist after this bounded window."""
    hasMoreAfter: Boolean!

    """Requested cursor line used to center the read."""
    cursorLine: Int!

    """Requested viewport line count."""
    viewportLineCount: Int!

    """True when the requested bounded window could not be fully returned."""
    truncated: Boolean!
}

"""Result of creating a product text buffer."""
type CreateBufferPayload {
    """Created product buffer."""
    buffer: TextBuffer!

    """Initial immutable basis for reading the created buffer."""
    textBasis: TextWindowBasis!

    """Initial session-local product version."""
    bufferVersion: Int!

    """Receipt identifier for the admitted creation."""
    receiptId: ID!
}

"""Result of applying a replace-range edit."""
type ReplaceRangePayload {
    """Edited product buffer."""
    buffer: TextBuffer!

    """Immutable basis for reading the admitted edit result."""
    textBasis: TextWindowBasis!

    """Updated session-local product version."""
    bufferVersion: Int!

    """Receipt identifier for the admitted edit."""
    receiptId: ID!
}

"""Input for creating a product text buffer."""
input CreateBufferInput {
    """Human-readable buffer key, such as a path-like editor name."""
    bufferKey: String!

    """Initial text contents for the new buffer."""
    initialText: String!

    """Optional projected filesystem path or external source path."""
    projectionPath: String
}

"""Input for applying a replace-range edit."""
input ReplaceRangeInput {
    """Product buffer identifier."""
    bufferId: ID!

    """Inclusive UTF-8 byte offset where replacement starts."""
    startByte: Int!

    """Exclusive UTF-8 byte offset where replacement ends."""
    endByte: Int!

    """Text inserted in place of the selected byte range."""
    insertText: String!
}

"""Input for reading a bounded text window."""
input TextWindowInput {
    """Opaque rope head that supplies text for this reading."""
    basisHeadId: ID!

    """Inclusive UTF-8 byte offset of the allowed materialization range."""
    startByte: Int!

    """Exclusive UTF-8 byte offset of the allowed materialization range."""
    endByte: Int!

    """Zero-based cursor line used to center the read."""
    cursorLine: Int!

    """Number of visible viewport lines requested."""
    viewportLineCount: Int!

    """Additional context lines requested before the viewport."""
    beforeLines: Int!

    """Additional context lines requested after the viewport."""
    afterLines: Int!

    """Maximum UTF-8 bytes allowed in the returned window."""
    maxBytes: Int!
}

"""Product-facing text buffer mutations."""
type Mutation {
    """Create a new text buffer and issue its first read basis handle."""
    createBuffer(input: CreateBufferInput!): CreateBufferPayload!

    """Apply a replace-range edit to an existing text buffer."""
    replaceRange(input: ReplaceRangeInput!): ReplaceRangePayload!
}

"""Product-facing text buffer reads."""
type Query {
    """Read a bounded text window from the explicit basis in the input."""
    textWindow(input: TextWindowInput!): TextWindowReading!
}
