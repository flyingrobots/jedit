"""Minimal generated-operation corridor for Echo-authoritative Jim text."""
type BufferWorldline {
    bufferId: ID!
    canonicalHeadId: ID!
    byteLength: Int!
    lineCount: Int!
}

type RopeCheckpointDeclaration {
    checkpointId: ID!
    bufferId: ID!
    basisHeadId: ID!
    basisByteLength: Int!
  reason: String!
}

type TextWindowLine {
    lineNumber: Int!
    startByte: Int!
    endByte: Int!
    text: String!
}

type TextWindowReading {
    bufferId: ID!
    basisHeadId: ID!
    rootNodeId: ID
    byteLength: Int!
    lineCount: Int!
    startByte: Int!
    endByte: Int!
    lines: [TextWindowLine!]!
}

input CreateBufferWorldlineInput {
    bufferKey: String!
    initialText: String!
    projectionPath: String
    """What the imported host coordinate held: file or missing."""
    importHostBasis: String!
    """Lowercase hex SHA-256 of the imported file bytes; set only for "file"."""
    importSha256: String
    """Byte length of the imported file; set only for "file"."""
    importByteLength: Int
}

input ReplaceRangeAsTickInput {
    bufferId: ID!
    basisHeadId: ID!
    startByte: Int!
    endByte: Int!
    insertText: String!
}

input DeclareCheckpointInput {
    bufferId: ID!
    basisHeadId: ID!
  reason: String!
}

input TextWindowInput {
    bufferId: ID!
    basisHeadId: ID!
    startByte: Int!
    endByte: Int!
    maxBytes: Int!
}

type Mutation {
    createBufferWorldline(input: CreateBufferWorldlineInput!): BufferWorldline!
    replaceRangeAsTick(input: ReplaceRangeAsTickInput!): BufferWorldline!
    declareCheckpoint(input: DeclareCheckpointInput!): RopeCheckpointDeclaration!
}

type Query {
    textWindow(input: TextWindowInput!): TextWindowReading!
}
